[workspace]
members = ["crates/interstellar-index", "crates/interstellar-wasm"]

[package]
name = "interstellar_db"
version = "0.1.0"
edition = "2024"

[lib]
name = "interstellar_db"
path = "src/lib.rs"

[[bin]]
name = "pipeline_demo"
path = "src/bin/pipeline_demo.rs"

[[bin]]
name = "server"
path = "src/bin/server.rs"

[[bin]]
name = "parabola_demo"
path = "src/bin/parabola_demo.rs"

[[bin]]
name = "bench"
path = "src/bin/bench.rs"

[dependencies]
interstellar-index = { path = "crates/interstellar-index" }
surrealkv = "0.21.2"
tokio = { version = "1", features = ["full"] }
tonic = "0.14.6"
tonic-prost = "0.14.6"
prost = "0.14"
prost-types = "0.14"
tokio-stream = "0.1"

[build-dependencies]
tonic-prost-build = "0.14.6"
protoc-bin-vendored = "3"

[dev-dependencies]
approx = "0.5"
